name: Disposable Over the Spectrum tapes fetch
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/zxdesk-ots-fetch.yml
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Download authentic TZX tape images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tapes
          for number in 1 2 3; do
            name="OverTheSpectrumCassette${number}"
            url="https://worldofspectrum.net/pub/sinclair/compilations/o/${name}.tzx.zip"
            curl --fail --location --silent --show-error --retry 2 --connect-timeout 20 --max-time 90 "$url" --output "/tmp/${name}.zip"
            unzip -t "/tmp/${name}.zip"
            tzx="$(unzip -Z1 "/tmp/${name}.zip" | grep -i '\.tzx$' | head -1)"
            test -n "$tzx"
            unzip -p "/tmp/${name}.zip" "$tzx" > "tapes/${name}.tzx"
            test "$(head -c 7 "tapes/${name}.tzx")" = 'ZXTape!'
          done
      - name: Pack three original TZX files
        uses: actions/upload-artifact@v4
        with:
          name: over-the-spectrum-three-tzx
          path: tapes/*.tzx
          if-no-files-found: error
          retention-days: 1
