name: rfortranc frontend

on:
  push:
    paths:
      - 'rfortranc/**'
      - '.github/workflows/rfortranc.yml'
  pull_request:
    paths:
      - 'rfortranc/**'
      - '.github/workflows/rfortranc.yml'
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile frontend and tools
        run: python -m compileall -q rfortranc/rfortranc rfortranc/tests rfortranc/tools
      - name: Check FORTRAN lowering and expected rejections
        run: python rfortranc/tests/run_tests.py --frontend-only
