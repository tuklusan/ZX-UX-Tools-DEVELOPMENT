name: rfortranc frontend

on:
  push:
    paths:
      - 'rfortranc/**'
      - '.github/workflows/rfortranc.yml'
  pull_request:
    paths:
      - 'rfortranc/**'
      - '.github/workflows/rfortranc.yml'
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile frontend and tools
        run: python -m compileall -q rfortranc/rfortranc rfortranc/tests rfortranc/tools
      - name: Check ANSI F77S partial restriction tests
        run: python -m unittest discover -s rfortranc/tests -p test_f77s.py
      - name: Check FORTRAN lowering and expected rejections
        run: python rfortranc/tests/run_tests.py --frontend-only
      - name: Check all strict F77S host reference outputs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gfortran
          python rfortranc/tests/check_gfortran_reference.py --report /tmp/f77s-host-reference.json
      - name: Keep host reference output report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f77s-host-reference
          path: /tmp/f77s-host-reference.json
          if-no-files-found: warn
          retention-days: 30
