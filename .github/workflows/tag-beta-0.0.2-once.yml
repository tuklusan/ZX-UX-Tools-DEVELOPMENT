name: One-shot beta-0.0.2 tag
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tag-beta-0.0.2-once.yml
permissions:
  contents: write
jobs:
  tag-and-remove-runner:
    if: github.event.head_commit.message == 'Run one-shot beta-0.0.2 tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Tag the exact ZXDesk beta commit
        env:
          TARGET_SHA: 588cf88c57057f0fb2771750b30076b7a3a005ac
        run: |
          set -euo pipefail
          git cat-file -e "$TARGET_SHA^{commit}"
          if git ls-remote --exit-code --tags origin refs/tags/beta-0.0.2 >/dev/null 2>&1; then
            echo 'beta-0.0.2 tag already exists; refusing to overwrite'
            exit 1
          fi
          git tag beta-0.0.2 "$TARGET_SHA"
          git push origin refs/tags/beta-0.0.2
      - name: Delete this one-time runner from main
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --ff-only origin main
          git rm -- .github/workflows/tag-beta-0.0.2-once.yml
          git commit -m 'Remove one-shot beta tag runner'
          git push origin HEAD:main
