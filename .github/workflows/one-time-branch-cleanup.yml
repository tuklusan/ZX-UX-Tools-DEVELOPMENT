name: One-time branch cleanup
on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-time-branch-cleanup.yml']
permissions:
  contents: write
jobs:
  remove-other-branches:
    if: github.repository == 'tuklusan/ZX-UX-Tools-DEVELOPMENT'
    runs-on: ubuntu-latest
    steps:
      - name: Delete every non-main branch ref
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$REPO/branches?per_page=100" --jq '.[].name' |
          while IFS= read -r branch; do
            if [ "$branch" != main ]; then
              gh api --method DELETE "repos/$REPO/git/refs/heads/$branch"
              echo "Removed branch: $branch"
            fi
          done
