name: One-time ZXDesk Tile fix build
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/zxdesk-tile-fix-once.yml
permissions:
  contents: write
jobs:
  build-test-remove:
    if: github.event.head_commit.message == 'Bound ZXDesk tiled application painting and provide clean console exit'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Build standalone ZXDesk
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p zxdesk/build zxdesk/tzx
          for m in entry api storage rect zxux; do
            python3 sdk/bin/py/ras.py -o "zxdesk/build/$m.sso" "src/zx-desk/platform/$m.asm"
          done
          for m in app wm note calendar commander keys screen text windows desktop menus clock settings panel dialog arrange terminal; do
            python3 sdk/bin/py/ras.py -o "zxdesk/build/$m.sso" "src/zx-desk/$m.asm"
          done
          modules='entry api storage rect zxux app wm note calendar commander keys screen text windows desktop menus clock settings panel dialog arrange terminal'
          objects=''
          for m in $modules; do objects="$objects zxdesk/build/$m.sso"; done
          python3 sdk/bin/py/rld.py --entry start --stack 384 --heap 0 -o zxdesk/build/zxdesk.ssx $objects
          python3 sdk/bin/py/rtap.py -o zxdesk/tzx/ZXDESK.tzx zxdesk/build/zxdesk.ssx=ZXDESK
      - name: Check Tile does not damage Spectrum attributes
        shell: bash
        run: |
          set -euo pipefail
          python3 sdk/bin/rvm --headless --system zx-ux/tzx/ZX-UX.tzx \
            --keys '{EDIT}5{EDIT}6{EDIT}7{EDIT}{EDIT}{EDIT}{DOWN}{DOWN}{DOWN}{DOWN}{ENTER}{WAIT 30}' \
            --frames 1500 --scr /tmp/zxdesk-tile.scr zxdesk/build/zxdesk.ssx
          python3 - <<'PY'
          from pathlib import Path
          screen = Path('/tmp/zxdesk-tile.scr').read_bytes()
          assert len(screen) == 6912, len(screen)
          bad = [(i, b) for i, b in enumerate(screen[6144:]) if b != 0x78]
          assert not bad, 'Tile wrote to Spectrum colour attributes: ' + str(bad[:10])
          print('Tile screen attributes unchanged')
          PY
      - name: Check FILES also fits a half-width tile
        shell: bash
        run: |
          set -euo pipefail
          python3 sdk/bin/rvm --headless --system zx-ux/tzx/ZX-UX.tzx \
            --keys '{EDIT}4{EDIT}5{EDIT}6{EDIT}{EDIT}{EDIT}{DOWN}{DOWN}{DOWN}{DOWN}{ENTER}{WAIT 30}' \
            --frames 1500 --scr /tmp/zxdesk-files-tile.scr zxdesk/build/zxdesk.ssx
          python3 - <<'PY'
          from pathlib import Path
          screen = Path('/tmp/zxdesk-files-tile.scr').read_bytes()
          assert len(screen) == 6912
          assert all(b == 0x78 for b in screen[6144:]), 'FILES Tile changed display attributes'
          print('FILES Tile screen attributes unchanged')
          PY
      - name: Check clean EDIT Q exit
        shell: bash
        run: |
          set -euo pipefail
          python3 sdk/bin/rvm --headless --system zx-ux/tzx/ZX-UX.tzx \
            --keys '{EDIT}q' --frames 1000 --final \
            --scr /tmp/zxdesk-exit.scr zxdesk/build/zxdesk.ssx
          test -s /tmp/zxdesk-exit.scr
      - name: Publish cassette and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add zxdesk/tzx/ZXDESK.tzx
          git rm -- .github/workflows/zxdesk-tile-fix-once.yml
          git commit -m 'Build corrected ZXDesk cassette and remove one-time workflow'
          git push origin HEAD:main
