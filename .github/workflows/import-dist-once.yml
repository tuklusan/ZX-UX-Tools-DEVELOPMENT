name: One-time import of upstream dist into repository root

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-dist-once.yml'

permissions:
  contents: write

jobs:
  replace-root:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out destination repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Replace contents with source dist
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 --filter=blob:none --sparse \
            https://github.com/tuklusan/ZX-UX-The-ZX-Spectrum-48K-Unix-Project-DEVELOPMENT.git \
            "$RUNNER_TEMP/upstream"
          git -C "$RUNNER_TEMP/upstream" sparse-checkout set dist
          test -f "$RUNNER_TEMP/upstream/dist/LICENSE"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          cp -a "$RUNNER_TEMP/upstream/dist/." .
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Replace root with upstream dist contents"
          git push origin HEAD:main
